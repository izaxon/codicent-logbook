name: Deploy site to GitHub Pages

# Publishes the repository root as a GitHub Pages site on every push to main.
# The repo content (including this workflow) is synced from the codicent-core
# monorepo by its logbook-site-deploy workflow — edit there, not here.

on:
   push:
      branches: [main]
   workflow_dispatch:

permissions:
   contents: read
   pages: write
   id-token: write

concurrency:
   group: pages
   cancel-in-progress: true

jobs:
   deploy:
      runs-on: ubuntu-latest
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - uses: actions/checkout@v4

         - name: Configure Pages
           uses: actions/configure-pages@v5
           with:
              enablement: true

         - name: Upload site
           uses: actions/upload-pages-artifact@v3
           with:
              path: .

         - name: Deploy
           id: deployment
           uses: actions/deploy-pages@v4
